name: n8n_health_dashboard

services:
  # n8n Health Monitoring Dashboard
  app:
    container_name: n8n_health_dashboard
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/n8n-dashboard.db
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      # OAuth Providers
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      # AI Providers
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_RCA_MODEL=${ANTHROPIC_RCA_MODEL:-claude-sonnet-4-20250514}
      - RCA_DEFAULT_DEPTH=${RCA_DEFAULT_DEPTH:-standard}
      - RCA_CORRELATION_WINDOW_MS=${RCA_CORRELATION_WINDOW_MS:-30000}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - REDIS_URL=redis://redis:6379
    volumes:
      - sqlite_data:/app/data
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - n8n-dashboard-network

  # Redis for caching and real-time features
  redis:
    container_name: n8n_health_dashboard_redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - n8n-dashboard-network

volumes:
  sqlite_data:
  redis_data:

networks:
  n8n-dashboard-network:
    driver: bridge
